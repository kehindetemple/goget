name: Build & Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: goget-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: goget-macos-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: goget-macos-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: goget-windows-amd64.exe

    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ${{ matrix.output }} .
        shell: bash
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.output }}